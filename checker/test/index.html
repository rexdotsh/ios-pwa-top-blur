<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>checker tests</title>
<style>
  body { margin: 0 auto; max-width: 860px; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: #111; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  ol { padding-left: 22px; }
  li { padding: 4px 0; border-top: 1px solid #eee; }
  .ok { color: #16a34a; font-weight: 700; }
  .bad { color: #dc2626; font-weight: 700; }
  .mute { color: #666; }
  iframe { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>
<h1>ios-top-edge-check: fixture tests</h1>
<p class="mute">Each fixture loads in a 390×844 frame. Expected results follow WebKit's rules at de94a1bcf328.</p>
<p id="summary">running…</p>
<ol id="list"></ol>
<script type="module">
  import { checkTopEdge } from "../ios-top-edge-check.js";
  import { FIXTURES, fixtureDoc } from "./fixtures.js";

  const list = document.getElementById("list");
  const load = (f) =>
    new Promise((resolve) => {
      const frame = document.createElement("iframe");
      frame.onload = () => requestAnimationFrame(() => resolve(frame));
      frame.srcdoc = fixtureDoc(f);
      document.body.appendChild(frame);
    });

  let passed = 0;
  const failures = [];
  for (const f of FIXTURES) {
    const frame = await load(f);
    const r = checkTopEdge({ window: frame.contentWindow });
    frame.remove();
    const okVerdict = r.verdict === f.expect;
    const okColor = !f.color || r.statusBarColor === f.color;
    const ok = okVerdict && okColor;
    if (ok) passed++;
    else failures.push(f.name);
    const li = document.createElement("li");
    li.innerHTML = `<span class="${ok ? "ok" : "bad"}">${ok ? "ok" : "FAIL"}</span> ${f.name}
      <span class="mute">· expected ${f.expect}${f.color ? ` ${f.color}` : ""}, got ${r.verdict}${r.statusBarColor ? ` ${r.statusBarColor}` : ""}</span>`;
    li.title = r.rules.map((x) => `${x.ok ? "✓" : "✗"} ${x.text}`).join("\n");
    list.appendChild(li);
  }
  const text = `${passed}/${FIXTURES.length} passed`;
  document.getElementById("summary").innerHTML = `<span class="${passed === FIXTURES.length ? "ok" : "bad"}">${text}</span>`;
  document.title = text;
  window.TEST_RESULT = { passed, total: FIXTURES.length, failures };
</script>
</body>
</html>
